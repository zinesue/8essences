<head>

    <style>
		
		.footer {
			margin-top: 60px;
			padding-top: 30px;
			border-top: 1px solid #d2d2d7;
			text-align: center;
		}

		.creator-tag {
			font-size: 0.9rem;
			color: #86868b;
			margin-bottom: 5px;
		}

		.instagram-link {

		}

		.instagram-link:hover {

		}

			font-size: 0.85rem;
			color: #a1a1a6;
			margin-top: 8px;

		}

		.highlight {
			color: var(--accent-color); 
			font-weight: 500;           
			display: inline;

        :root {
            --bg-color: #ffffff;
            --text-color: #1d1d1f;
            --accent-color: #0071e3;
            --secondary-bg: #f5f5f7;
            --border-radius: 12px;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        #app {
            max-width: 600px;
            width: 90%;
            padding: 40px 20px;
            text-align: center;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .active {
            display: block;
        }

        h1 { font-weight: 700; font-size: 2rem; margin-bottom: 20px; }
        p { font-weight: 300; font-size: 1.1rem; color: #6e6e73; }

        .btn-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background-color: var(--secondary-bg);
            border: none;
            padding: 20px 30px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-color);
        }

        button:hover {
            background-color: #e8e8ed;
            transform: translateY(-2px);
        }

        .start-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
        }

        .start-btn:hover {
            background-color: #0077ed;
            color: white;
        }

        .result-header { margin-bottom: 40px; border-bottom: 1px solid #d2d2d7; padding-bottom: 20px; }
        .type-name { font-size: 1.8rem; color: var(--accent-color); font-weight: 700; display: block; margin-top: 10px; }
        .content-box { text-align: left; background: var(--secondary-bg); padding: 25px; border-radius: var(--border-radius); margin-bottom: 30px; }
        .content-box h3 { margin-top: 0; font-size: 1.2rem; border-left: 4px solid var(--accent-color); padding-left: 10px; }
        .guide-section { margin-top: 50px; text-align: left; }
        .guide-title { font-weight: 700; font-size: 1.4rem; margin-bottom: 20px; text-align: center; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
		.date-tag {
			font-size: 0.75rem;
			color: #a1a1a6; /* 연한 회색 */
			margin-top: 4px;

</head>

    function startTest() {
        showScreen('question-screen');
        renderQuestion('start');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function renderQuestion(qKey) {
        const q = questions[qKey];
        document.getElementById('question-text').innerText = q.text;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.onclick = () => {
                if (opt.result) showResult(opt.result);
                else renderQuestion(opt.next);
            };
            container.appendChild(btn);
        });
    }

	function showResult(typeId) {
		const type = types[typeId];
		const otherType = types[type.targetId]; // 상대 유형 정보 가져오기

		// 상단 유형 명칭 및 설명
		document.getElementById('res-type-name').innerText = type.name;
		document.getElementById('res-type-desc').innerHTML = type.desc;

		// 내가 이해하기 어려운 유형 섹션
		document.getElementById('hard-to-understand-title').innerText = `내가 이해하기 어려운 유형: [${otherType.name}]`;
		document.getElementById('hard-to-understand-content').innerHTML = `
			<p><strong>어려운 점:</strong> "${type.hard}"</p>
			<p><strong>이해를 위한 팁:</strong> ${type.tip}</p>
		`;

		// 나를 이해하기 어려워하는 유형 섹션 (나의 입장에서 대답)
		document.getElementById('hard-for-me-title').innerText = `나를 이해하기 어려워하는 유형: [${otherType.name}]`;
		document.getElementById('hard-for-me-content').innerHTML = `
			<p><strong>나를 향한 오해:</strong> "${type.misunderstanding}"</p>
			<p><strong>나의 대답:</strong> ${type.myAnswer}</p>
		`;

		showScreen('result-screen');
		window.scrollTo(0, 0);
	}
