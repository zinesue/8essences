<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인간다움의 8가지 유형 테스트</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1d1d1f;
            --accent-color: #0071e3;
            --contrast-color: #ff9500;
            --secondary-bg: #f5f5f7;
            --border-radius: 12px;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        #app {
            max-width: 600px;
            width: 90%;
            padding: 40px 20px;
            text-align: center;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .active {
            display: block;
        }

        h1 { font-weight: 700; font-size: 2rem; margin-bottom: 20px; }
        p { font-weight: 300; font-size: 1.1rem; color: #6e6e73; }

        .btn-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background-color: var(--secondary-bg);
            border: none;
            padding: 20px 30px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-color);
        }

        button:hover {
            background-color: #e8e8ed;
            transform: translateY(-2px);
        }

        .start-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
        }

        .start-btn:hover {
            background-color: #0077ed;
        }

        .result-header { margin-bottom: 40px; border-bottom: 1px solid #d2d2d7; padding-bottom: 20px; }
        .type-name { font-size: 1.8rem; color: var(--accent-color); font-weight: 700; display: block; margin-top: 10px; }
        
        .content-box { text-align: left; background: var(--secondary-bg); padding: 25px; border-radius: var(--border-radius); margin-bottom: 20px; }
        .content-box h3 { margin-top: 0; font-size: 1.2rem; border-left: 4px solid var(--accent-color); padding-left: 10px; }
        
        /* 잘 안 맞는 유형 전용 스타일 (대비색 적용) */
        .bad-match-box h3 {
            border-left-color: var(--contrast-color) !important;
        }

        .guide-section { margin-top: 50px; text-align: left; }
        .guide-title { font-weight: 700; font-size: 1.4rem; margin-bottom: 20px; text-align: center; }
        
        .footer { margin-top: 60px; padding-top: 30px; border-top: 1px solid #d2d2d7; text-align: center; }
        .creator-tag { font-size: 0.9rem; color: #86868b; margin-bottom: 5px; }
        .instagram-link { color: var(--text-color); text-decoration: none; font-weight: 500; font-size: 1.1rem; }
        .zine-desc { font-size: 0.85rem; color: #a1a1a6; margin-top: 8px; font-weight: 300; }
        .highlight { color: var(--accent-color); font-weight: 500; display: inline; }
        .date-tag { font-size: 0.75rem; color: #a1a1a6; margin-top: 4px; letter-spacing: 0.05em; font-weight: 300; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="start-screen" class="screen active">
        <h1>인간다움의 8가지 유형</h1>
        <p>당신이 생각하는 인간다움은 어떤 모양인가요?<br>짧은 선택을 통해 당신의 철학적 유형을 확인해보세요.</p>
        <div class="btn-container">
            <button class="start-btn" onclick="startTest()">테스트 시작하기</button>
        </div>
    </div>

    <div id="question-screen" class="screen">
        <h2 id="question-text">질문 내용</h2>
        <div id="options-container" class="btn-container"></div>
    </div>

    <div id="result-screen" class="screen">
        <div class="result-header">
            <p>당신의 인간다움 유형은</p>
            <span id="res-type-name" class="type-name">유형 이름</span>
        </div>
        
        <div class="content-box">
            <h3>유형 특징</h3>
            <div id="res-type-desc">유형 설명</div>
        </div>

        <div class="guide-section">
            <div class="guide-title">서로 다른 인간다움을 위한 가이드</div>
            
            <div class="content-box">
                <h3 id="good-match-title">나와 잘 맞는 유형</h3>
                <div id="good-match-content"></div>
            </div>

            <div class="content-box bad-match-box">
                <h3 id="bad-match-title">나와 잘 안 맞는 유형</h3>
                <div id="bad-match-content"></div>
            </div>
        </div>
        
        <div class="footer">
            <div class="date-tag">Published. 2026. 04.</div>
            <div class="creator-tag">Created by</div>
            <a href="https://www.instagram.com/zinesue_/" target="_blank" class="instagram-link">@zinesue_</a>
            <div class="zine-desc">↑ 한계를 허무는 독립출판 프로젝트 보러가기 ↑</div>
        </div>

        <button onclick="location.reload()" style="margin-top: 20px;">다시 테스트하기</button>
    </div>
</div>

        },
        8: { 
            name: "부정·파기형", 
            targetId: 2, 
            matchId: 7,
            desc: "인간다움은 특정 속성이 아니라, 자신에게 부여된 <span class='highlight'>인간성의 기준마저 의식적으로 거부할 수 있는 능력</span>에 있다고 보는 독특한 유형입니다. 인간은 단순히 인간답게 살 수 있는 존재일 뿐만 아니라, 인간이기를 포기하거나 자기 인간성을 배반할 수도 있는 존재입니다. 이러한 자기 파기와 부정의 가능성이야말로 인간만의 극단적인 특징이라고 봅니다.", 
			hard: "연약한 규범을 왜 그렇게 절대적인 진리처럼 떠받들며 융통성 없이 구는 거야?",
            misunderstanding: "어떻게 자신이 세운 기준과 인간성을 스스로 배반할 수 있지? 그건 인간으로서의 타락이자 실패 아닌가?",
            tip: "그들이 도덕을 고수하는 이유는 자유가 없어서가 아니라, 자유롭기 때문에 스스로를 옥죄는 선을 긋고 가치를 창조하려 애쓰는 것입니다.",
            matchDesc: "부정·파기형은 실존·선택형에게 아직 넘지 못한 경계를 부수는 과감함을 주고, 실존·선택형은 부정·파기형의 부정이 공허한 해체에 머물지 않도록 삶의 형태로 다시 세워 줍니다. 함께 있을 때 반항은 창조가 되고, 해체는 새로운 선택의 출발점이 됩니다."
        }
    };

    const questions = {
        start: { text: "인간다움이란 어느 쪽에 더 가깝나요?", options: [{ text: "지켜야 할 보편적 가치와 기준이 중요함", next: "2A" }, { text: "고정된 기준보다 개별적 상황과 자유가 중요함", next: "2B" }] },
        "2A": { text: "인간다움이란 어디에서 오나요?", options: [{ text: "내가 스스로 생각하고 판단하는 힘", next: "3A" }, { text: "타인과 내가 함께 살아가는 세상", next: "3B" }] },
        "2B": { text: "인간답기 위해 당신은 무엇을 하고 싶나요?", options: [{ text: "인위적인 자아나 구속에서 벗어나기", next: "3C" }, { text: "끊임없는 선택과 결단으로 나를 증명함", next: "3D" }] },
        "3A": { text: "더 가치 있는 노력은 무엇일까요?", options: [{ text: "내가 왜 이렇게 사는지 끊임없이 돌아보는 것", result: 1 }, { text: "서툴러도 옳다고 믿는 규범을 묵묵히 실천하는 것", result: 2 }] },
        "3B": { text: "인간을 인간답게 만드는 연결고리는 무엇인가요?", options: [{ text: "서로의 존재를 인정하고 응답하는 만남", result: 3 }, { text: "사회의 구성원으로서 맡은 역할과 조화", result: 4 }] },
        "3C": { text: "본래의 나를 찾는 가장 자연스러운 방법은?", options: [{ text: "애써 꾸미지 않고 세상의 흐름에 나를 맡기는 것", result: 5 }, { text: "변하지 않는 '나'라는 고집을 내려놓고 비워내는 것", result: 6 }] },
        "3D": { text: "내가 나를 만들어 갈 때 더 본질적인 모습은?", options: [{ text: "불안하더라도 스스로의 삶을 책임지며 선택하는 것", result: 7 }, { text: "자기 인간성의 기준조차 스스로 포기할 수 있는 자유", result: 8 }] }
    };

    function startTest() { showScreen('question-screen'); renderQuestion('start'); }
    function showScreen(screenId) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(screenId).classList.add('active'); }

    function renderQuestion(qKey) {
        const q = questions[qKey];
        document.getElementById('question-text').innerText = q.text;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.onclick = () => { if (opt.result) showResult(opt.result); else renderQuestion(opt.next); };
            container.appendChild(btn);
        });
    }

    function showResult(typeId) {
        const type = types[typeId];
        const badType = types[type.targetId];
        const goodType = types[type.matchId];

        // 1. 내 유형 설명
        document.getElementById('res-type-name').innerText = type.name;
        document.getElementById('res-type-desc').innerHTML = type.desc;

        // 2. 나와 잘 맞는 유형 (데이터 적용)
        document.getElementById('good-match-title').innerText = `나와 잘 맞는 유형: [${goodType.name}]`;
        document.getElementById('good-match-content').innerHTML = `<p>${type.matchDesc}</p>`;

        // 3. 나와 잘 안 맞는 유형
        document.getElementById('bad-match-title').innerText = `나와 잘 안 맞는 유형: [${badType.name}]`;
        document.getElementById('bad-match-content').innerHTML = `
            <p><strong>내가 이해하기 어려운 점:</strong> "${type.hard}"</p>
			<p style="margin-top:15px; font-size:0.9rem; color:#86868b; line-height: 1.4;">* Tip: ${type.tip}</p>
            <p><strong>내가 받는 오해:</strong> "${type.misunderstanding}"</p>
            
        `;

        showScreen('result-screen');
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
